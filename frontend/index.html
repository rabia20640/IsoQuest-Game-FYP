<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IsoQuest</title>

    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<h1>IsoQuest</h1>

<div id="target-graph"></div>
<div id="blank-graph"></div>

<div id="colour-palette">
    <p>Select a color:</p>
    <div class="colour-option" data-colour="#E63946" style="background:#E63946;"></div>
    <div class="colour-option" data-colour="#457B9D" style="background:#457B9D;"></div>
    <div class="colour-option" data-colour="#2A9D8F" style="background:#2A9D8F;"></div>
    <div class="colour-option" data-colour="#FFD700" style="background:#FFD700;"></div>
    <div class="colour-option" data-colour="#0000FF" style="background:#0000FF;"></div>
    <div class="colour-option" data-colour="#ffffff" style="background:#ffffff; border:1px solid #000;"></div>
</div>

<div class="button-row">
    <button id="check-answer-btn">Check Answer</button>
    <button id="next-level-btn" disabled>Next level</button>
    <button id="show-mapping-btn" style="display:none;">Show Mapping</button>
</div>

<p id="feedback"></p>

<div id="mapping-modal" class="modal">
    <div class="modal-content">
        <span id="close-modal" class="close">&times;</span>
        <h2>Isomorphism Mapping</h2>
        <pre id="mapping-text"></pre>
    </div>
</div>

<div id="game-over" style="display:none;" class="game-over-container">
    <h1>Congratulations!</h1>
    <p>You have completed all levels of IsoQuest.</p>

    <p class="summary-text">
        You successfully solved all graph isomorphism challenges.
    </p>
    <button id="restart-btn" class="restart-btn">Play Again</button>
</div>


<script src="https://unpkg.com/cytoscape/dist/cytoscape.min.js"></script>
<script src="/static/script.js"></script>
</body>
</html>
