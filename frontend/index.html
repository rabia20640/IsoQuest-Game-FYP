<!DOCTYPE html>
<html lang="en">
<head>

    <title>IsoQuest</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>
<h1>IsoQuest</h1>

<div id="target-graph"></div>
<div id="blank-graph"></div>

<div id="colour-palette">
    <p>Select a colour:</p>
    <div class="colour-option" data-colour="#ff0000" style="background:#ff0000;"></div>
    <div class="colour-option" data-colour="#00aaff" style="background:#00aaff;"></div>
    <div class="colour-option" data-colour="#00cc99" style="background:#00cc99;"></div>
    <div class="colour-option" data-colour="#ffcc00" style="background:#ffcc00;"></div>
    <div class="colour-option" data-colour="#ffffff" style="background:#ffffff; border:1px solid #000;"></div>
</div>

<script src="https://unpkg.com/cytoscape/dist/cytoscape.min.js"></script>
    <script src="script.js"></script>
